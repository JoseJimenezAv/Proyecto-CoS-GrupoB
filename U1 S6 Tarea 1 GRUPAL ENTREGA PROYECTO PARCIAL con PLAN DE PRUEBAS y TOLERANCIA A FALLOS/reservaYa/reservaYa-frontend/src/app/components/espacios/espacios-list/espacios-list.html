<!-- Contenedor principal de la vista de listado de espacios -->
<div class="espacios">
    <!-- Barra lateral de navegación -->
    <app-sidebar></app-sidebar>
    
    <!-- Área de contenido principal -->
    <div class="espacios-contenido">
        <!-- Barra superior de navegación -->
        <app-navbar></app-navbar>
        
        <main>
            <!-- Encabezado con descripción y botón para abrir el modal de creación -->
            <div class="cabecera">
                <p>Administra las canchas y salones disponibles.</p>
                <button (click)="abrirModalEspacioCrear()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Nuevo espacio
                </button>
            </div>
    
            <!-- Cuadrícula de tarjetas con los espacios registrados -->
            <div class="tarjetas-espacios">
                <!-- Itera sobre listaEspacio y renderiza una tarjeta por cada espacio -->
                @for (lista of listaEspacio; track lista.id_espacio) {
                    <div class="tarjeta">
                        <!-- Encabezado de la tarjeta con ícono y badge de disponibilidad -->
                        <div class="tarjeta-encabezado">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-padding preview-icon"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M14 17h-4"/><path d="M14 7h-4"/><path d="M17 14v-4"/><path d="M7 14v-4"/></svg>
                            <span [ngClass]="lista.estado === 'Disponible' ? 'colorVerde' : 'colorGris'">{{ lista.estado }}</span>
                        </div>
    
                        <!-- Nombre y tipo del espacio -->
                        <h3>{{ lista.nombre }}</h3>
                        <p>{{ lista.tipo }}</p>
    
                        <!-- Pie de la tarjeta con capacidad, tarifa por hora y acciones de editar/eliminar -->
                        <div class="tarjeta-final">
                            <div class="informacion">
                                <div class="capacidad">
                                    <dt>Capacidad</dt>
                                    <dd style="color: #0F172B;">{{ lista.capacidad }} personas</dd>
                                </div>
    
                                <div class="precio">
                                    <dt>Precio por hora</dt>
                                    <dd style="color: #008236">${{ lista.precio_hora }}</dd>
                                </div>
                            </div>

                            <div class="acciones">
                                <svg (click)="abrirModalEspacioEditar(lista)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btnEditar lucide lucide-pencil preview-icon"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                                <svg (click)="eliminar(lista.id_espacio)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btnBorrar lucide lucide-trash preview-icon"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </div>
                        </div>
                    </div>
                }
            </div>            
        </main>
    </div>
</div>
