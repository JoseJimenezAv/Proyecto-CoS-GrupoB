<!-- Contenedor principal del modal para crear o editar un cliente -->
<div class="modal-contenedor">
    <!-- Encabezado con título dinámico según el modo y botón de cierre -->
    <div class="modal-encabezado">
        <h2>{{ esModoEditar ? 'Editar cliente' : 'Nuevo cliente'}}</h2>
        <svg [mat-dialog-close]="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon" style="cursor: pointer;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>

    <!-- Formulario reactivo vinculado a clienteModalFormulario -->
    <form [formGroup]="clienteModalFormulario" (ngSubmit)="guardar()">
        <!-- Campos de entrada para los datos del cliente -->
        <div class="grupo-formulario">
            <label>Nombre completo</label>
            <input type="text" formControlName="nombre_completo" (input)="limpiarError()" [class.invalido]="campoInvalido('nombre_completo')">
        </div>

        <div class="grupo-formulario">
            <label>Cédula</label>
            <input type="text" maxlength="10" formControlName="cedula" (input)="limpiarError()" [class.invalido]="campoInvalido('cedula')">
        </div>

        <div class="grupo-formulario">
            <label>Teléfono</label>
            <input type="text" maxlength="10" formControlName="telefono" (input)="limpiarError()" [class.invalido]="campoInvalido('telefono')">
        </div>

        <div class="grupo-formulario">
            <label>Correo electrónico</label>
            <input type="email" formControlName="correo" (input)="limpiarError()" [class.invalido]="campoInvalido('correo')">
        </div>

        @if (mensajeError()) {
            <div class="mensajeError" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                <span>{{ mensajeError() }}</span>
            </div>
        }

        <!-- Acciones del modal para cancelar o enviar el formulario -->
        <div mat-dialog-actions class="botones-modal">
            <button type="button" [mat-dialog-close]="false" class="btnCancelar">Cancelar</button>
            <button type="submit" class="btnGuardar">{{ esModoEditar ? 'Actualizar cliente' : 'Guardar cliente' }}</button>
        </div>
    </form>
</div>
