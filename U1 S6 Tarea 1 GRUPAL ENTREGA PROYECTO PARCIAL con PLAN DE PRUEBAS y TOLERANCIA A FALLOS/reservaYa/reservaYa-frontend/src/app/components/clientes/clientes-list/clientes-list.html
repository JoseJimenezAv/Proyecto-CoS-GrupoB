<!-- Contenedor principal de la vista de listado de clientes -->
<div class="clientes">
    <!-- Barra lateral de navegación -->
    <app-sidebar></app-sidebar>
    
    <!-- Área de contenido principal -->
    <div class="clientes-contenido">
        <!-- Barra superior de navegación -->
        <app-navbar></app-navbar>
        
        <main>
            <!-- Encabezado con descripción y botón para abrir el modal de creación -->
            <div class="cabecera">
                <p>Gestiona la información de tus clientes.</p>
                    <button (click)="abrirModalClienteCrear()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Nuevo cliente
                </button>
            </div>

            <!-- Tabla dinámica con los clientes registrados -->
            <div class="tabla">
                <table>
                    <thead>
                        <tr class="encabezado-tabla">
                            <th>NOMBRE</th>
                            <th>CÉDULA</th>
                            <th>TELÉFONO</th>
                            <th>CORREO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody class="cuerpo-tabla">
                        <!-- Itera sobre listaClientes y renderiza cada fila con sus acciones de editar y eliminar -->
                        @for (cliente of listaClientes; track cliente.id_cliente) {
                            <tr>
                                <td>{{ cliente.nombre_completo  }}</td>
                                <td>{{ cliente.cedula }}</td>
                                <td>{{ cliente.telefono }}</td>
                                <td>{{ cliente.correo }}</td>
                                <td class="acciones-tabla">
                                    <svg (click)="abrirModalClienteEditar(cliente)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=" btnEditar lucide lucide-pencil preview-icon"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                                    <svg (click)="eliminar(cliente.id_cliente)" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btnBorrar lucide lucide-trash preview-icon"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
